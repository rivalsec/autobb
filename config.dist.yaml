juicer_filters:
  cname: []
  tls_dns: []
  title404: []
  location: []

# Sibling apex-domain suggestion (--apex-suggest, modules/scope_osint.py).
# Mines other registrable domains the org likely owns from TLS SANs + CNAME/PTR
# already in MongoDB (suggest-only — paste confirmed apexes into scope.domains).
scope_suggest:
  min_sources: 2          # require this many distinct (type, evidence) signals
  ignore_apexes:          # third-party/CDN/SaaS apexes that are never the org's
    - google.com
    - googleapis.com
    - gstatic.com
    - googleusercontent.com
    - doubleclick.net
    - cloudflare.com
    - cloudflare.net
    - akamai.net
    - akamaiedge.net
    - akamaitechnologies.com
    - amazonaws.com
    - cloudfront.net
    - azureedge.net
    - windows.net
    - fastly.net
    - fbcdn.net
    - jsdelivr.net
    - cloudflare-dns.com

# Offline IP->ASN enrichment (modules/asn.py). The dataset (a generic public
# BGP dump — does NOT leak the target list) is downloaded into the runtime dir
# at pipeline start when missing. refresh=true forces a fresh copy every start.
asn:
  refresh: false
  url: https://iptoasn.com/data/ip2asn-combined.tsv.gz
  timeout: 60
  # CDN/cloud ASNs to ignore when guessing org-owned netblocks (--asn-suggest,
  # never auto-scans). Includes cloud hosting (AWS/GCP/Azure) since assets there
  # aren't "your netblock".
  cloud_asns: [13335, 16509, 14618, 15169, 396982, 8075, 54113, 16625, 20940, 12222, 14061, 13238, 19551, 209242, 54994]
  # CDN/WAF *fronting* providers, for silencing ASN/prefix change-alert noise
  # (CDN<->CDN rotation, origin->CDN). Deliberately EXCLUDES cloud hosting so a
  # leaked origin on AWS/GCP/Azure still alerts. Unlisted fronts are also caught
  # by as_name (override the default with cdn_front_pattern). Numbers optional.
  cdn_front_asns: []
  # cdn_front_pattern: '(CDN|CLOUDFLARE|AKAMAI|FASTLY|INCAPSULA|...)'
  # Fronts that live INSIDE a mixed-use cloud ASN, where the ASN alone can't tell
  # an edge from an origin: cloudfront edges and bare EC2 both announce as
  # AMAZON-02, so listing 16509 above would silence leaked origins too. Matched
  # against every hop of the CNAME chain (not just the first — a host often
  # reaches the edge via an in-scope alias). An entry matches a whole
  # dot-delimited label run, as a suffix or in the middle, so 'elb' catches both
  # *.<region>.elb.amazonaws.com and *.elb.<region>.amazonaws.com, while
  # 'cloudfront.net' never matches evilcloudfront.net. These are provider-wide,
  # so the defaults work as-is; add the fronts your targets actually use.
  # Do NOT add site-builder/SaaS hosts that are takeover signals (e.g. tilda.ws).
  cdn_front_cnames:
    - cloudfront.net
    - elb                    # aws elb, both label orderings
    - execute-api            # aws api gateway
    - ghs.google.com         # google workspace custom domains
    - googlehosted.com
    - akamaiedge.net
    - edgekey.net
    - edgesuite.net
    - azureedge.net
    - trafficmanager.net
    - msappproxy.net         # azure ad application proxy
    - fastly.net
  suggest_min_assets: 3      # min distinct assets on an ASN to call it org-owned
  suggest_max_prefixes: 50   # skip ASNs announcing more ranges (shared hosting)
  suggest_alive_days: 30     # only seed from assets seen alive in this window
  # ASN->prefix source for suggestion. pyasn (real BGP RIB) is far more accurate
  # than iptoasn for org core ASNs. Leave pyasn_db empty to auto-build a fresh
  # db from RouteViews at suggest-time (~70MB download + convert); or point it at
  # a prebuilt .dat you refresh out-of-band (pyasn_util_download/convert via cron).
  # If pyasn or the db is unavailable, suggestion falls back to iptoasn prefixes.
  pyasn_db: ''
  pyasn_refresh: false       # rebuild the auto-built db each run even if present
  pyasn_build_timeout: 600

db:
  conn_str: 'mongodb://bbmongodb:27017'
  database: 'autobbdb'

# Single source of truth for User-Agent and custom headers.
# Applied to every HTTP-making tool: httpx, nuclei, ffuf.
http_headers:
  user_agent: ''   # e.g. 'autobb-recon (bugbounty)'
  custom: []       # extra headers in "Name: Value" form
  # custom:
  #   - 'X-Bug-Bounty: rivalsec'

subfinder:
  cmd: [
    'subfinder',
    # '-config', './subfinder_config.yaml'
  ]

nuclei:
  scan_timeout: 0   # seconds; wall-clock cap on a single nuclei_active run (0 disables)
  exclude_templates: []
  # exclude_templates:
    # - ./nuclei-templates/http/technologies/tech-detect.yaml
    # - ./nuclei-templates/http/technologies/nginx/nginx-version.yaml
  cmd: [
    'nuclei', '-no-color', '-jsonl',
    #'-t', "./nuclei-my-templates",
    '-t', './nuclei-templates',
    '-bulk-size', '100',
    '-concurrency', '1',   # one template at a time across many hosts -> gentle per host, load spread across assets
  ]
  # network templates on ports without http(s)
  network_cmd: [
    'nuclei', '-no-color', '-jsonl',
    #'-t', "./nuclei-my-templates",
    '-t', './nuclei-templates',
    '-tags', 'network', # only network templates
    '-bulk-size', '50',
    '-concurrency', '4',
  ]
  passive_cmd: [
    'nuclei', '-no-httpx', '-no-color', '-jsonl', '-passive', 
    '-c', '3',
    '-bs', '1',
    '-t', './nuclei-templates',
    #'-t', './nuclei-my-templates',
  ]  

